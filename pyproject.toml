[project]
name = "tesis"
version = "0.1.0"
description = "Modelado de Dinámica del Mercado de Valores"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "yfinance>=1.7.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "jupytext",
    "ipykernel"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupytext>=1.19.5",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

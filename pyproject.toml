[project]
name = "tesis"
version = "0.1.0"
description = "Modelado de Dinámica del Mercado de Valores"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "yfinance>=1.7.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "librosa>=0.11.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "arch>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "jupytext",
    "ipykernel"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# PyTorch se instala desde el índice de wheels CPU para evitar descargar las
# dependencias CUDA (~3 GB) que no aporta nada en este proyecto.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupytext>=1.19.5",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests que requieren red o datos reales (se omiten por defecto)",
]
addopts = "-m 'not integration'"
